[project]
name = "secret-loyalties-hackathon-apart-research"
version = "0.1.0"
description = "Secret loyalty detection skeleton: Petri auditing + contrastive-pair linear probes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43,<0.50",  # 0.50.0 shipped a mac-only wheel, no manylinux
    "huggingface_hub>=0.24",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "inspect_petri>=3.0",
    "inspect-ai>=0.3.60",
    "openai>=1.40",
    "python-dotenv>=1.0",
    # rm_channel (Track 4) training deps; installed on the A100 pod via pip.
    "peft>=0.11",
    "trl>=0.11",
    "datasets>=2.20",
]

[tool.uv]
package = false
# This project only ever runs on the Linux RunPod box. required-environments
# makes "a wheel compatible with this platform must exist" a hard resolution
# constraint, so uv backtracks off any release (e.g. a bad bitsandbytes) that
# only shipped a macOS wheel and no manylinux one.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
