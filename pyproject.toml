[project]
name = "secret-loyalties-hackathon-apart-research"
version = "0.1.0"
description = "Secret loyalty detection skeleton: Petri auditing + contrastive-pair linear probes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "huggingface_hub>=0.24",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "inspect_petri>=3.0",
    "inspect-ai>=0.3.60",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
# This project only ever runs on the Linux RunPod box. Restricting resolution
# to Linux avoids uv trying to satisfy macOS-only wheels (e.g. a bitsandbytes
# release that shipped a mac wheel but no manylinux one), so it backtracks to
# a version that actually has a Linux wheel.
environments = ["sys_platform == 'linux'"]
